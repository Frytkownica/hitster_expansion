<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hitster — utwór</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .player-page { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #111; color: #fff; }
    .player-card { width: min(100%, 440px); text-align: center; }
    .player-card h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 8vw, 2.6rem); }
    .player-card p { margin: 0 0 20px; color: #c9c9c9; }
    .spotify-player { width: 100%; min-height: 152px; border: 0; border-radius: 12px; }
    .player-back { display: inline-block; margin-top: 24px; color: #fff; }
  </style>
</head>
<body class="player-page">
  <main class="player-card">
    <p id="song-year"></p>
    <h1 id="song-title">Ładowanie utworu…</h1>
    <p id="song-artist"></p>
    <iframe id="spotify-player" class="spotify-player" title="Spotify player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="eager"></iframe>
    <a class="player-back" href="index.html">Wróć do gry</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const track = params.get("track") || "";
    const validTrack = /^[A-Za-z0-9]{22}$/.test(track);
    document.getElementById("song-title").textContent = params.get("title") || "Nieznany utwór";
    document.getElementById("song-artist").textContent = params.get("artist") || "";
    document.getElementById("song-year").textContent = params.get("year") || "";
    if (validTrack) {
      document.getElementById("spotify-player").src = `https://open.spotify.com/embed/track/${encodeURIComponent(track)}`;
    } else {
      document.getElementById("song-title").textContent = "Nieprawidłowy identyfikator utworu";
    }
  </script>
</body>
</html>
